name: Verificar site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar páginas e arquivos
        run: python3 scripts/check.py
      - name: Verificar JavaScript
        run: |
          for script in assets/js/*.js assets/js/*.mjs; do node --check "$script"; done
      - name: Verificar editor e backups
        run: node --test tests/*.test.mjs
      - name: Verificar pacote público
        run: python3 scripts/build.py
